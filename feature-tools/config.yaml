# ============================================================
#  Фича Инструменты — файл настроек
# ------------------------------------------------------------
#  Меняйте значения справа от двоеточия. После изменения
#  перезапустите сервис (Ctrl+C в Terminal, затем ./run.sh).
# ============================================================

# --- Горячая клавиша (зажать и говорить) -------------------
# Поддерживаются: right_option, left_option, right_cmd,
#                 left_cmd, right_ctrl, fn, f13..f19
# По умолчанию right_option — безопасная клавиша, которая
# почти не используется в системе.
hotkey: "right_option"

# --- Язык распознавания -------------------------------------
# auto — определять автоматически (русский/английский)
# ru   — только русский
# en   — только английский
language: "auto"

# --- Модель распознавания речи (Whisper) --------------------
# tiny   — самая быстрая, качество низкое
# base   — быстрая, для слабых Mac
# small  — баланс скорости и качества (рекомендуется)
# medium — лучше качество, медленнее, нужен мощный Mac
whisper_model: "small"

# --- Куда отдавать готовый текст ----------------------------
# auto_paste     — только попытаться вставить в активное поле
# clipboard_only — только скопировать в буфер обмена
# both           — скопировать в буфер И попытаться вставить
paste_mode: "both"

# --- Улучшение текста локальной нейросетью (Ollama) ---------
# true  — улучшать текст через Ollama (если установлена)
# false — использовать простую встроенную очистку
use_ollama: true
ollama_model: "qwen2.5:7b"

# --- Как обрабатывать текст ---------------------------------
# raw           — почти сырая транскрибация
# clean         — починить грамматику/пунктуацию, близко к сказанному
# prompt_writer — оформить как аккуратный промт для AI (по умолчанию)
# letter        — оформить как вежливое письмо
# note          — оформить как короткую заметку/список
text_mode: "prompt_writer"

# --- Тонкие настройки записи --------------------------------
min_record_seconds: 0.4     # короче — считается случайным нажатием
max_record_seconds: 120     # дольше — запись остановится сама
sample_rate: 16000          # частота записи (менять не нужно)

# --- Дополнительно ------------------------------------------
play_sounds: true           # звук в начале и конце записи
show_notifications: true    # уведомление macOS после готовности
save_history: true          # сохранять историю последних диктовок
history_limit: 20           # сколько записей хранить
